name: Artifacts
on:
  workflow_dispatch:
  pull_request:
jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64, linux-x64, linux-arm64, osx-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish src/WeaveCopilot -r ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true -c Release -o out/${{ matrix.rid }}
      - run: cp THIRD-PARTY-NOTICES out/${{ matrix.rid }}/THIRD-PARTY-NOTICES
      - uses: actions/upload-artifact@v4
        with:
          name: weave-copilot-${{ matrix.rid }}
          path: |
            out/${{ matrix.rid }}/weave-copilot
            out/${{ matrix.rid }}/weave-copilot.exe
            out/${{ matrix.rid }}/THIRD-PARTY-NOTICES
          if-no-files-found: error
