name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp (for example 0.2.0). Builds the archives only; no release is created.
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64, linux-x64, linux-arm64, osx-x64, osx-arm64]
    env:
      VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish and package
        run: |
          version="${VERSION#v}"
          dotnet publish src/WeaveCopilot -r ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true -p:Version="$version" -c Release -o out/${{ matrix.rid }}
          cp THIRD-PARTY-NOTICES out/${{ matrix.rid }}/THIRD-PARTY-NOTICES
          mkdir -p dist
          name="weave-copilot-$version-${{ matrix.rid }}"
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            (cd out/${{ matrix.rid }} && zip -q "$GITHUB_WORKSPACE/dist/$name.zip" weave-copilot.exe THIRD-PARTY-NOTICES)
          else
            tar -C out/${{ matrix.rid }} -czf "dist/$name.tar.gz" weave-copilot THIRD-PARTY-NOTICES
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: SHA256SUMS
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
      - name: Create the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --title "weave-copilot ${{ github.ref_name }}" --generate-notes
